<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Starsector Web</title>
    <script src="https://cjrtnc.leaningtech.com/4.2/loader.js"></script>
    <style>
        body { margin: 0; background: #000; color: #0f0; font-family: monospace; }
        #ui { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; z-index: 100; }
        #progress { width: 400px; height: 10px; border: 1px solid #0f0; margin: 10px auto; }
        #bar { width: 0%; height: 100%; background: #0f0; }
        button { padding: 10px 20px; background: #000; color: #0f0; border: 1px solid #0f0; cursor: pointer; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <div id="ui">
        <h1>STARSECTOR</h1>
        <div id="progress"><div id="bar"></div></div>
        <div id="status">Ready</div><br>
        <button id="btn">START ENGINE</button>
    </div>
    <canvas id="display"></canvas>

    <script type="module">
        const ui = {
            bar: document.getElementById('bar'),
            status: document.getElementById('status'),
            btn: document.getElementById('btn'),
            ui: document.getElementById('ui')
        };

        // OVERCLOCK: Bypass VSync for faster loop
        window.requestAnimationFrame = (callback) => setTimeout(callback, 1);

        // --- 1. WALL BREAKER PREFETCHER ---
        async function prefetch() {
            ui.status.innerText = "Loading Manifest...";
            const assets = await fetch('assets.json').then(r => r.json());
            
            const TOTAL = assets.length;
            let loaded = 0;
            let skipped = 0;
            const WORKERS = 4;
            const TIMEOUT_MS = 10000; // 10s timeout per file

            ui.status.innerText = "Queueing " + TOTAL + " files...";
            const queue = assets.filter(f => (f.endsWith('.jar') || f.endsWith('.json') || f.endsWith('.csv')) && !f.includes('/8/jre/') && !f.includes('/17/jre/') && !f.includes('/jre_linux/'));

            async function worker() {
                while (queue.length > 0) {
                    const file = queue.shift();
                    
                    try {
                        const controller = new AbortController();
                        const id = setTimeout(() => controller.abort(), TIMEOUT_MS);
                        
                        const response = await fetch(file, { signal: controller.signal });
                        clearTimeout(id);
                        
                        if (!response.ok) throw new Error(response.status);
                        await response.blob();
                        
                        loaded++;
                        if (loaded % 10 === 0) {
                            const p = (loaded / TOTAL * 100).toFixed(1);
                            ui.bar.style.width = p + "%";
                            ui.status.innerText = "Cached: " + loaded + " / " + TOTAL + " (Skipped: " + skipped + ")";
                        }
                    } catch (e) { 
                        skipped++;
                        console.warn("SKIPPED (Timeout/Error):", file, e);
                    }
                }
            }

            const threads = Array(WORKERS).fill(null).map(() => worker());
            await Promise.all(threads);
            ui.status.innerText = "Prefetch Complete. Skipped: " + skipped + ". Booting JVM...";
        }

        // --- 2. ENGINE BOOT ---
        ui.btn.addEventListener('click', async () => {
            ui.btn.style.display = 'none';
            // await prefetch();
            
            ui.status.innerText = "Initializing Java 17 (Local Runtime)...";
            const ROOT = window.location.origin + "/";

            try {
                await cheerpjInit({
                    natives: { window: { lwjglCanvasElement: document.getElementById("display") } },
                    fileSystem: {
                        mountPoint: "/app",
                        type: "overlay",
                        lower: { type: "http", url: ROOT },
                        upper: { type: "indexedDB", name: "starsector_v1" }
                    },
                    runtime: { version: "8", url: "/8/jre/lib/rt.jar" },
                    javaProperties: [
                        "java.version=1.8", "os.name=Linux",
                        "user.dir=/app", "user.home=/app/saves",
                        "java.library.path=/app/native/linux:/app/native",
                        "org.lwjgl.librarypath=/app/native/linux:/app/native",
                        "com.fs.starfarer.settings.paths.mods=/app/mods",
                        "com.fs.starfarer.settings.paths.saves=/app/saves",
                        "com.fs.starfarer.settings.paths.logs=/app/logs",
                        "fs.game.dir=/app", "com.fs.starfarer.settings.linux=true", "log4j.configuration=/app/console_log4j.properties",
                        "legacyLauncher=true", "log4j.debug=true", "java.awt.headless=false"
                    ],
                    arguments: [
                        "--add-opens=java.base/java.lang=ALL-UNNAMED",
                        "--add-opens=java.base/java.util=ALL-UNNAMED",
                        "--add-opens=java.base/java.nio=ALL-UNNAMED", 
                        "--add-opens=java.desktop/java.awt=ALL-UNNAMED",
                        "-Xmx1500m", "-Xms512m"
                    ]
                });

                cheerpjCreateDisplay(1280, 768);
                ui.status.innerText = "Executing CombatMain...";
                
                const assets = await fetch('assets.json').then(r => r.json());
                const classpath = assets
                    .filter(f => f.endsWith('.jar') && !f.includes('/'))
                    .map(f => "/app/" + f)
                    .join(":");

                console.log('Classpath:', classpath); await cheerpjRunMain("com.fs.starfarer.combat.CombatMain", classpath);
                ui.ui.style.display = 'none';

            } catch (e) {
                ui.status.innerText = "FATAL: " + e.message;
                ui.status.style.color = "red";
                console.error(e);
            }
        });
    </script>
</body>
</html>
